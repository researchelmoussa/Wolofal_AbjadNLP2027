<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AbjadNLP 2027 · Wolofal</title>
<meta name="description" content="Contributor portal for the Wolofal data collection and annotation of the AbjadNLP 2027 shared tasks.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="tasks.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette and type follow abjadnlp.com */
:root{
  --ink:#20262d; --muted:#667178; --line:#e1e6e5; --canvas:#f5f7f6; --white:#fff;
  --deep:#173f3d; --deep2:#0b2d2b; --teal:#1d6d66; --gold:#d4ad61; --gold-ink:#9a742f; --gold-soft:#f3e3c4;
  --sand:#f8f3e9; --ruby:#8b3342; --ruby-soft:#f6e6e9; --teal-soft:#e8f2ef;
  --shadow:0 16px 42px rgba(20,48,47,.10); --shadow-sm:0 7px 24px rgba(20,48,47,.075);
  --max:1220px; --radius:17px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:82px}
body{background:var(--canvas);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
::selection{background:#ead19d;color:#17302f}
h1,h2,h3{font-weight:700;line-height:1.1;margin:0 0 .5em;color:var(--deep)}
h1{font-size:clamp(2.4rem,5vw,4.2rem);letter-spacing:-.05em;line-height:.98}
h2{font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.04em}
h3{font-size:1.05rem;letter-spacing:-.01em}
p{margin:0 0 1em}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.narrow{max-width:900px}
.hidden{display:none!important}
.kicker{font-size:.71rem;text-transform:uppercase;letter-spacing:.16em;color:var(--gold-ink);font-weight:700;margin-bottom:9px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.74rem;text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:#f1d69e;margin-bottom:18px}
.eyebrow:before{content:"";width:30px;height:2px;background:var(--gold)}

/* header */
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(225,230,229,.92);box-shadow:0 3px 18px rgba(20,48,47,.05)}
.nav{max-width:var(--max);margin:auto;padding:10px 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img{width:46px;height:46px;border-radius:12px;flex:none}
.brand-copy{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-copy strong{font-size:1.02rem;color:var(--deep)}
.brand-copy span{font-size:.65rem;text-transform:uppercase;letter-spacing:.13em;color:#8a6928;font-weight:700;margin-top:6px;white-space:nowrap}
.nav .spacer{flex:1}
.who{color:var(--muted);font-size:.84rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}

/* buttons & inputs */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--deep);font:inherit;font-size:.85rem;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;transition:.18s}
.btn:hover{border-color:#b9c8c5;transform:translateY(-1px)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.primary:hover{background:var(--teal);border-color:var(--teal)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#183433}
.btn.danger{color:var(--ruby)}
.btn.sm{padding:7px 10px;font-size:.74rem;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default;transform:none}
label{display:block;font-size:.8rem;font-weight:700;color:var(--deep);margin:0 0 .35em}
input,textarea,select{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:11px;padding:.65em .8em}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(29,109,102,.18);border-color:var(--teal)}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem}
.field{margin-bottom:14px}
.hint{color:var(--muted);font-size:.85rem}
.msg{border-radius:11px;padding:.65em .85em;font-size:.9rem;margin-bottom:14px;font-weight:500}
.msg.err{background:var(--ruby-soft);color:var(--ruby)}
.msg.ok{background:var(--teal-soft);color:var(--teal)}

/* dark hero, shared by login and student page */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(100deg,rgba(8,34,33,.99),rgba(17,62,58,.96) 52%,rgba(35,91,82,.88)),radial-gradient(circle at 80% 22%,rgba(212,173,97,.28),transparent 30%)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:36px 36px}
.hero:after{content:"ا  ب  ج  د";position:absolute;right:-25px;bottom:-64px;font-family:"Noto Kufi Arabic",sans-serif;font-weight:700;font-size:clamp(8rem,19vw,17rem);color:rgba(255,255,255,.045);white-space:nowrap;direction:rtl;pointer-events:none}
.hero > *{position:relative;z-index:2}
.hero h1{color:#fff}
.hero h1 em{font-style:normal;color:#f2d79e}

/* login */
.login{min-height:calc(100vh - 67px);display:grid;place-items:center;padding:60px 18px}
.login-grid{max-width:var(--max);width:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.login-intro p{color:#d9e5e3;font-size:1.05rem;max-width:560px}
.login-intro h1{font-size:clamp(2.4rem,4.6vw,3.9rem)}
.login-card{width:100%;max-width:460px;justify-self:end;background:#fff;color:var(--ink);border-radius:22px;box-shadow:0 24px 70px rgba(4,26,25,.28);padding:30px}
.login-card h2{font-size:1.45rem;margin-bottom:.2em}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef3f2;border-radius:12px;padding:4px;margin:18px 0 20px}
.tabs button{border:0;background:transparent;font:inherit;font-size:.85rem;font-weight:700;color:#4e5e60;padding:.55em;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--deep);color:#fff}

/* student page */
.s-hero{padding:90px 0 80px}
.s-hero .lead{font-size:1.1rem;color:#d9e5e3;max-width:760px;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:11px;padding:8px 13px;font-size:.82rem;font-weight:700;color:#fff}
.chip.gold{background:var(--gold);border-color:var(--gold);color:#183433}
.sec{padding:64px 0}
.sec.white{background:#fff}
.sec.deep{background:var(--deep2);color:#fff}
.sec.deep h2,.sec.deep h3{color:#fff}
.sec.deep .kicker{color:#f1d69e}
.prose p{color:#4f5e62}
.sec.deep .prose p,.sec.deep li{color:#c7d8d6}
.grid{display:grid;gap:16px;margin-top:26px}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:23px;box-shadow:var(--shadow-sm)}
.card h3{font-size:1.08rem;margin:6px 0 8px}
.card p{color:var(--muted);font-size:.9rem}
.card p:last-child{margin-bottom:0}
.card a{font-size:.8rem;font-weight:700;text-decoration:none}
.tag{font-size:.67rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gold-ink);font-weight:700}
.task-card{position:relative}
.task-card.mine{border-color:#c8dcd7;background:linear-gradient(135deg,#e8f2ef,#f8f4e8)}
.task-card .mine-badge{position:absolute;top:18px;right:18px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--deep);color:#fff;border-radius:99px;padding:.25em .7em}
.impact{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.impact li{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.065);border-radius:17px;padding:20px;font-size:.9rem}
.impact li strong{display:block;color:#fff;font-size:1rem;margin-bottom:5px}
.quote{border-left:4px solid var(--gold);padding:2px 0 2px 20px;margin-top:26px;color:#fff;font-size:1.12rem;font-weight:600;line-height:1.45}
.thanks{background:linear-gradient(115deg,#fff8eb,#f2e0bd);border:1px solid #ead5ae;border-radius:20px;padding:32px;box-shadow:var(--shadow-sm)}
.thanks p{color:#55534d}
.badge-a{display:inline-flex;align-items:center;gap:6px;background:var(--deep);color:#f1d69e;border-radius:9px;padding:.15em .55em;font-size:.82em;font-weight:700;white-space:nowrap}
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:22px}
.links a{display:block;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px;text-decoration:none;color:var(--deep);font-weight:700;font-size:.9rem;box-shadow:var(--shadow-sm)}
.links a:hover{border-color:#b9c8c5}
.links a span{display:block}
.links a span+span{color:var(--muted);font-size:.78rem;font-weight:500}
footer{background:#092725;color:#bfd0ce;padding:34px 0;font-size:.82rem}
footer strong{color:#fff}
footer a{color:#f0d49b;text-decoration:none}

/* admin */
.admin-hero{padding:46px 0 70px}
.admin-hero p{color:#c7d8d6;margin:0}
.admin-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
.admin-head h1{font-size:clamp(2rem,4vw,3rem);margin:0 0 6px}
.admin-body{margin-top:-40px;padding-bottom:50px;position:relative;z-index:3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:2rem;line-height:1;color:var(--deep);letter-spacing:-.04em}
.stat span{display:block;margin-top:7px;font-size:.7rem;font-weight:700;color:#846627;text-transform:uppercase;letter-spacing:.08em}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar input{flex:1 1 240px;width:auto}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow-x:auto;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0ef;vertical-align:top}
thead th{font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gold-ink);font-weight:700;background:var(--sand);white-space:nowrap}
thead tr.groups th{border-bottom:0;padding-bottom:0;color:var(--deep)}
thead th.grp{text-align:center;border-left:1px solid var(--line)}
th.gl,td.gl{border-left:1px solid #edf0ef}
tbody tr:hover{background:#fafcfb}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:.8rem}
td .note{color:var(--ruby);max-width:260px;font-size:.78rem;margin-top:4px}
td.lc{min-width:120px}
.lvl{display:inline-block;margin-top:3px;font-size:.7rem;font-weight:700;border-radius:6px;padding:.1em .45em;background:#eef3f2;color:#4e5e60}
.lvl.adv{background:var(--teal-soft);color:var(--teal)}
.lvl.mid{background:var(--gold-soft);color:#7a5a17}
.lvl.beg{background:var(--ruby-soft);color:var(--ruby)}
select.st{width:auto;min-width:104px;font-size:.78rem;font-weight:700;padding:.35em .5em;border-radius:9px;cursor:pointer}
.st-incomplete{background:var(--ruby-soft);color:var(--ruby);border-color:#efd0d6}
.st-ongoing{background:var(--gold-soft);color:#7a5a17;border-color:#ead5ae}
.st-completed{background:var(--teal-soft);color:var(--teal);border-color:#c8dcd7}
.task-card .mine-badge.sb-incomplete{background:var(--ruby)}
.task-card .mine-badge.sb-ongoing{background:var(--gold);color:#183433}
.task-card .mine-badge.sb-completed{background:var(--teal)}
.ajami{font-weight:700;color:var(--deep)}
code.k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sand);border:1px solid #ecdfc4;color:var(--deep);border-radius:7px;padding:.2em .5em;font-size:.84rem;white-space:nowrap}
.pill{display:inline-block;font-size:.7rem;font-weight:700;border-radius:99px;padding:.15em .6em;margin:1px}
.pill.t{background:var(--teal-soft);color:var(--teal)}
.pill.on{background:var(--teal-soft);color:var(--teal)}
.pill.off{background:var(--ruby-soft);color:var(--ruby)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;min-width:170px}
.actions .btn{padding:6px 8px}
.meta{margin-top:6px;line-height:1.5}
td.who-cell{min-width:230px;max-width:280px}
.admin-body.wrap,.admin-hero .wrap{max-width:1480px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--ink);padding:0;width:min(620px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(9,39,37,.55)}
dialog form{padding:26px}
dialog h2{font-size:1.5rem}
dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog fieldset{border:1px solid var(--line);border-radius:14px;padding:12px 14px 2px;margin:0 0 14px}
dialog legend{font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gold-ink);font-weight:700;padding:0 6px}
@media (max-width:560px){dialog .row{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:14px}
.checks label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);margin:0}
.checks input{width:auto}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
pre.invite{white-space:pre-wrap;background:var(--sand);border-radius:12px;padding:14px;font-size:.86rem;max-height:320px;overflow:auto;margin:0 0 12px;font-family:inherit}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep2);color:#fff;padding:.65em 1.15em;border-radius:11px;font-size:.88rem;font-weight:600;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:80px 16px;text-align:center;color:var(--muted)}

.lang{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff;flex:none}
.lang button{border:0;background:transparent;font:inherit;font-size:.72rem;font-weight:700;color:#4e5e60;padding:5px 9px;border-radius:7px;cursor:pointer}
.lang button.on{background:var(--deep);color:#fff}
@media(max-width:900px){.login-grid{grid-template-columns:1fr;gap:30px}.login-card{justify-self:stretch;max-width:none}}
@media(max-width:760px){.wrap{padding:0 18px}.nav{padding-inline:18px}.s-hero{padding:64px 0 56px}.sec{padding:48px 0}}
@media(max-width:520px){.brand-copy span{display:none}.who{display:none}}
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav" aria-label="Primary">
    <a class="brand" href="#/"><img src="assets/abjadnlp-logo.png" alt="AbjadNLP logo"><div class="brand-copy"><strong>AbjadNLP 2027 · Wolofal</strong><span data-i18n="brand_sub"></span></div></a>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button>
    </div>
    <button class="btn sm hidden" id="logoutBtn" type="button" data-i18n="signout"></button>
  </nav>
</header>

<main id="app"><div class="loading">…</div></main>

<!-- ───────── Login ───────── -->
<template id="tpl-login">
  <section class="hero login">
    <div class="login-grid">
      <div class="login-intro">
        <div class="eyebrow" data-i18n="login_eyebrow"></div>
        <h1 data-i18n="login_title"></h1>
        <p data-i18n="login_text"></p>
      </div>
      <div class="login-card">
        <div class="kicker" data-i18n="card_kicker"></div>
        <h2 data-i18n="card_title"></h2>
        <div class="tabs" role="tablist">
          <button type="button" data-tab="student" class="on" role="tab" data-i18n="tab_student"></button>
          <button type="button" data-tab="admin" role="tab" data-i18n="tab_admin"></button>
        </div>
        <div id="loginMsg"></div>
        <form id="studentForm" autocomplete="on">
          <div class="field"><label for="sEmail" data-i18n="lbl_email"></label>
            <input id="sEmail" type="email" required autocomplete="email" data-i18n-ph="ph_email"></div>
          <div class="field"><label for="sCode" data-i18n="lbl_code"></label>
            <input id="sCode" required autocomplete="off" placeholder="WOL-XXXX-XXXX" style="text-transform:uppercase;letter-spacing:.05em"></div>
          <button class="btn primary" style="width:100%" type="submit" data-i18n="btn_signin"></button>
          <p class="hint" style="margin:14px 0 0" data-i18n="code_help"></p>
        </form>
        <form id="adminForm" class="hidden" autocomplete="on">
          <div class="field"><label for="aEmail" data-i18n="lbl_admin_email"></label>
            <input id="aEmail" type="email" required autocomplete="username"></div>
          <div class="field"><label for="aPass" data-i18n="lbl_password"></label>
            <input id="aPass" type="password" required autocomplete="current-password"></div>
          <button class="btn primary" style="width:100%" type="submit" data-i18n="btn_signin_admin"></button>
        </form>
      </div>
    </div>
  </section>
</template>

<!-- ───────── Student presentation ───────── -->
<template id="tpl-student">
  <section class="hero s-hero">
    <div class="wrap">
      <div class="eyebrow" data-i18n="s_eyebrow"></div>
      <h1><span data-i18n="s_welcome"></span> <em data-bind="firstName"></em>.</h1>
      <p class="lead" data-i18n="s_lead"></p>
      <div class="chips">
        <span class="chip" data-i18n="chip_place"></span>
        <span class="chip" data-i18n="chip_dates"></span>
        <span class="chip gold" data-i18n="chip_coling"></span>
        <span class="chip" data-i18n="chip_edition"></span>
      </div>
      <div class="subnav"><a href="#/welcome" class="on" data-i18n="nav_pres"></a><a href="#/tasks" data-i18n="nav_tasks"></a></div>
    </div>
  </section>

  <!-- 1 -->
  <section class="sec">
    <div class="wrap narrow prose">
      <div class="kicker" data-i18n="k1"></div>
      <h2 data-i18n="h1t"></h2>
      <p data-i18n="p1a"></p>
      <p data-i18n="p1b"></p>
      <div class="links">
        <a href="https://abjadnlp.com/abjad2027.html" target="_blank" rel="noopener"><span data-i18n="l_site"></span><span>abjadnlp.com/abjad2027.html</span></a>
        <a href="https://abjadnlp.com/abjad2027.html#tasks" target="_blank" rel="noopener"><span data-i18n="l_tasks"></span><span>abjadnlp.com/abjad2027.html#tasks</span></a>
        <a href="https://aclanthology.org/venues/abjadnlp/" target="_blank" rel="noopener"><span data-i18n="l_procs"></span><span>aclanthology.org/venues/abjadnlp</span></a>
      </div>
    </div>
  </section>

  <!-- 2 -->
  <section class="sec white">
    <div class="wrap narrow prose">
      <div class="kicker" data-i18n="k2"></div>
      <h2 data-i18n="h2t"></h2>
      <p data-i18n="p2"></p>
      <div class="grid cols-2">
        <div class="card"><div class="tag" data-i18n="st01"></div><h3>AbjadGenEval</h3><p data-i18n="st01p"></p><a href="https://abjadnlp.com/abjad2027/AbjadGenEval.html" target="_blank" rel="noopener" data-i18n="task_page"></a></div>
        <div class="card"><div class="tag" data-i18n="st03"></div><h3>AbjadAuthorID</h3><p data-i18n="st03p"></p><a href="https://abjadnlp.com/abjad2027/AbjadAuthorID.html" target="_blank" rel="noopener" data-i18n="task_page"></a></div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let lang = store.get('wol_lang') || ((navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en');
const t = (k, vars) => { let s = (I18N[lang][k] ?? I18N.en[k] ?? k); for (const v in (vars || {})) s = s.split('{' + v + '}').join(vars[v]); return s; };
function applyI18n(root = document){
  $$('[data-i18n]', root).forEach(el => el.innerHTML = t(el.dataset.i18n));
  $$('[data-i18n-ph]', root).forEach(el => el.placeholder = t(el.dataset.i18nPh));
}

function setLang(l){
  lang = l; store.set('wol_lang', l);
  document.documentElement.lang = l;
  $$('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  applyI18n(document);

}

function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
function showMsg(el, kind, text){ el.innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ''; }
function mount(tplId){ const c = $(tplId).content.cloneNode(true); applyI18n(c); app.replaceChildren(c); }
const loadingHtml = () => `<div class="loading">${esc(t('loading'))}</div>`;

async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:'POST', headers:{apikey:SUPABASE_KEY, 'Content-Type':'application/json'}, body:JSON.stringify(args || {})
  });
  const txt = await r.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) {
    const m = (data && data.message) || `Request failed (${r.status})`;
    const err = new Error(m === 'too_many_attempts' ? t('too_many') : m === 'not_authorized' ? t('expired') : m);
    err.code = m; throw err;
  }
  return data;
}

function setBar(text, showLogout){ $('#who').textContent = text || ''; $('#logoutBtn').classList.toggle('hidden', !showLogout); }

  if (h.startsWith('#/welcome')) return renderStudent();
  return renderLogin();
}

/* ── login ── */
function renderLogin(){
  if (store.get('wol_admin')) { location.hash = '#/admin'; return; }
  if (store.get('wol_student')) { location.hash = '#/welcome'; return; }
  setBar('', false);
  mount('#tpl-login');
  const msg = $('#loginMsg');
  $$('.tabs button').forEach(b => b.addEventListener('click', () => {
    $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $('#studentForm').classList.toggle('hidden', b.dataset.tab !== 'student');
    $('#adminForm').classList.toggle('hidden', b.dataset.tab !== 'admin');
    showMsg(msg);
  }));
  $('#studentForm').addEventListener('submit', async e => {
    e.preventDefault(); const btn = e.submitter; btn.disabled = true; showMsg(msg);
    try {
      const r = await rpc('abjad_student_login', {p_email:$('#sEmail').value, p_code:$('#sCode').value});
      if (!r.ok) return showMsg(msg, 'err', t('bad_student'));
      store.set('wol_student', r.token); location.hash = '#/welcome';
    } catch (err) { showMsg(msg, 'err', err.message); } finally { btn.disabled = false; }
  });
  $('#adminForm').addEventListener('submit', async e => {
    e.preventDefault(); const btn = e.submitter; btn.disabled = true; showMsg(msg);
    try {
      const r = await rpc('abjad_admin_login', {p_email:$('#aEmail').value, p_password:$('#aPass').value});
      if (!r.ok) return showMsg(msg, 'err', t('bad_admin'));
      store.set('wol_admin', r.token); location.hash = '#/admin';
    } catch (err) { showMsg(msg, 'err', err.message); } finally { btn.disabled = false; }
  });
}

/* ── student page ── */
async function renderStudent(){
  const token = store.get('wol_student');
  if (!token) { location.hash = '#/'; return; }
  app.innerHTML = loadingHtml();
  let me;
  try { me = await rpc('abjad_student_me', {p_token:token}); }
  catch (e) { app.innerHTML = `<div class="loading">${esc(t('server'))} ${esc(e.message)}</div>`; return; }
  if (!me) { store.del('wol_student'); location.hash = '#/'; return; }
  setBar(me.full_name || me.email, true);
  mount('#tpl-student');
  $('[data-bind="firstName"]').textContent = (me.full_name || '').trim().split(/\s+/)[0] || '';
  $('[data-bind="email"]').textContent = me.email;
  const mine = me.tasks || [];
  $$('.task-card').forEach(c => {
    const on = mine.includes(c.dataset.task);
    c.classList.toggle('mine', on); $('.mine-badge', c).classList.toggle('hidden', !on);
  });
  const paintStatus = () => $$('.task-card').forEach(c => {
    const v = statusOf(me, c.dataset.task), b = $('.mine-badge', c);
    b.textContent = t('s_' + v); b.className = 'mine-badge sb-' + v + (mine.includes(c.dataset.task) ? '' : ' hidden');
  });
  redraw = () => {
    paintStatus();
    const names = mine.map(x => t('tn' + x.slice(1)));
    $('[data-bind="taskIntro"]').textContent = mine.length === 3 ? t('intro_all')
      : mine.length > 1 ? t('intro_some', {tasks:names.join(t('and'))})
      : mine.length === 1 ? t('intro_one', {tasks:names[0]}) : t('intro_none');
  };
  redraw();
  window.scrollTo(0, 0);
}

async function adminCall(fn, args){
  try { return await rpc(fn, {p_token:store.get('wol_admin'), ...args}); }
  catch (e) { if (e.code === 'not_authorized') { store.del('wol_admin'); location.hash = '#/'; } throw e; }
}
async function loadStudents(){
  try { students = await adminCall('abjad_admin_list_students', {}) || []; }
  catch (e) { toast(e.message); return; }
  drawStats(); drawRows();
}
function drawStats(){
  if (!$('#stats')) return;
  const active = students.filter(s => s.active).length;
  const signed = students.filter(s => s.last_login_at).length;
  const all = students.flatMap(s => TASKS.map(k => statusOf(s, k)));
  const done = all.filter(x => x === 'completed').length, ongoing = all.filter(x => x === 'ongoing').length;
  $('#stats').innerHTML = [
    [students.length, t('st_total')], [active, t('st_active')], [signed, t('st_signed')], [students.length - signed, t('st_never')],
    [`${done}/${students.length * 3}`, t('st_done')], [ongoing, t('st_ongoing')]
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${esc(l)}</span></div>`).join('');
}

/* language cells: pair "Français, Anglais" with "Avancé, Intermédiaire" */
function lvlClass(l){
  l = (l || '').toLowerCase();
  if (/avanc|advanced|natif|native|courant|fluent/.test(l)) return 'adv';
  if (/interm/.test(l)) return 'mid';
  if (/d[ée]butant|beginner|basic|notions/.test(l)) return 'beg';
  return '';
}
function langCell(langs, levels, strong){
  const ls = (langs || '').split(/\s*[,;\/]\s*/).filter(Boolean);
  if (!ls.length) return '<span class="sub">—</span>';
  const vs = (levels || '').split(/\s*[,;\/]\s*/).filter(Boolean);
  return ls.map((x, i) => {
    const v = vs.length === ls.length ? vs[i] : (i === 0 ? vs.join(', ') : '');
    return `<div><span class="${strong ? 'ajami' : ''}">${esc(x)}</span>${v ? ` <span class="lvl ${lvlClass(v)}">${esc(v)}</span>` : ''}</div>`;
  }).join('');
}
const TASKS = ['T0','T1','T2'], STATUSES = ['incomplete','ongoing','completed'];
const statusOf = (s, k) => (s.task_status || {})[k] || 'incomplete';
function statusCell(s, k, first){
  const v = statusOf(s, k);
  return `<td class="${first ? 'gl' : ''}"><select class="st st-${v}" data-task="${k}" aria-label="${k}">${
    STATUSES.map(o => `<option value="${o}"${o === v ? ' selected' : ''}>${esc(t('s_' + o))}</option>`).join('')}</select></td>`;
}
const prefCell = c => {
  if (!c) return '<span class="sub">—</span>';
  return c.split(/\s*\+\s*/).filter(Boolean).map(n => `<span class="pill t">${esc(t('tn' + (Number(n) - 1)) || n)}</span>`).join(' ');
};
const fmtDate = d => d ? new Date(d).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-GB', {dateStyle:'medium', timeStyle:'short'}) : '—';
function drawRows(){
  if (!$('#rows')) return;
  const q = ($('#search').value || '').toLowerCase().trim();
  const list = students.filter(s => !q || [s.full_name, s.email, s.institution, s.code, s.notes, ...Object.values(s.profile || {})].join(' ').toLowerCase().includes(q));
  $('#emptyRows').classList.toggle('hidden', students.length > 0);
  $('#rows').innerHTML = list.map(s => { const p = s.profile || {}; return `
    <tr data-id="${esc(s.id)}">
      <td class="who-cell"><b>${esc(s.full_name || '—')}</b><div class="sub">${esc(s.email)}</div><div style="margin-top:5px"><code class="k">${esc(s.code)}</code>${s.ann_id ? ` <span class="pill t">${esc(s.ann_id)}</span>` : ''}</div>${s.institution ? `<div class="sub">${esc(s.institution)}</div>` : ''}<div class="meta">${s.active ? `<span class="pill on">${esc(t('active'))}</span>` : `<span class="pill off">${esc(t('disabled'))}</span>`} <span class="sub">${esc(t('th_last'))}: ${fmtDate(s.last_login_at)} · ${s.login_count} ${esc(s.login_count === 1 ? t('signin1') : t('signins'))}</span></div>${s.notes ? `<div class="note">⚠ ${esc(s.notes)}</div>` : ''}</td>
      <td class="lc gl">${langCell(p.local_languages, p.local_level)}</td>
      <td class="lc">${langCell(p.arabic_script, p.arabic_script_level, true)}</td>
      <td class="lc">${langCell(p.foreign_languages, p.foreign_level)}</td>
      ${TASKS.map((k, i) => statusCell(s, k, i === 0)).join('')}
      <td><div class="actions">
        <button class="btn sm" data-act="invite" type="button">${esc(t('act_invite'))}</button>
        <button class="btn sm" data-act="copy" type="button">${esc(t('act_copy'))}</button>
        <button class="btn sm" data-act="edit" type="button">${esc(t('act_edit'))}</button>
        <button class="btn sm" data-act="regen" type="button">${esc(t('act_regen'))}</button>
        <button class="btn sm danger" data-act="del" type="button">${esc(t('act_del'))}</button>
      </div></td>
    </tr>`; }).join('');
}
async function onStatusChange(e){
  const sel = e.target.closest('select.st'); if (!sel) return;
  const s = students.find(x => x.id === sel.closest('tr').dataset.id); if (!s) return;
  const prev = statusOf(s, sel.dataset.task), next = sel.value;
  sel.className = 'st st-' + next; sel.disabled = true;
  try {
    const u = await adminCall('abjad_admin_set_task_status', {p_id:s.id, p_task:sel.dataset.task, p_status:next});
    Object.assign(s, u); drawStats(); toast(t('toast_status', {name:s.full_name || s.email, task:sel.dataset.task, status:t('s_' + next)}));
  } catch (err) { sel.value = prev; sel.className = 'st st-' + prev; toast(err.message); }
  finally { sel.disabled = false; }
}
async function onRowClick(e){
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const s = students.find(x => x.id === b.closest('tr').dataset.id); if (!s) return;
  const act = b.dataset.act;
  if (act === 'copy') return copy(s.code, t('toast_copied'));
  if (act === 'invite') return openInvite(s);
  if (act === 'edit') return openStudent(s);
  if (act === 'regen') {
    if (!confirm(t('confirm_regen', {email:s.email}))) return;
    try { const u = await adminCall('abjad_admin_regenerate_code', {p_id:s.id}); Object.assign(s, u); drawRows(); toast(t('toast_newcode', {code:u.code})); }
    catch (err) { toast(err.message); }
  }
  if (act === 'del') {
    if (!confirm(t('confirm_del', {email:s.email}))) return;
    try { await adminCall('abjad_admin_delete_student', {p_id:s.id}); students = students.filter(x => x !== s); drawStats(); drawRows(); toast(t('toast_deleted')); }
    catch (err) { toast(err.message); }
  }
}
async function copy(text, label){
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch { prompt('', text); }
}

  $$('#studentEdit [data-pk]').forEach(i => i.value = p[i.dataset.pk] || '');
  const tasks = s ? s.tasks : ['T0','T1','T2'];
  $$('#studentEdit input[name=task]').forEach(c => c.checked = tasks.includes(c.value));
  $('#dlgStudent').showModal();
}
$('#studentEdit').addEventListener('submit', async e => {
  if (e.submitter?.value !== 'save') return;
  e.preventDefault();
  const row = {
    full_name:$('#fName').value, email:$('#fEmail').value, institution:$('#fInst').value, notes:$('#fNotes').value,
    tasks:$$('#studentEdit input[name=task]:checked').map(c => c.value),
    profile:Object.fromEntries($$('#studentEdit [data-pk]').map(i => [i.dataset.pk, i.value.trim()]))
  };
  const btn = $('#studentSave'); btn.disabled = true;
  try {
    if (editing) {
      const u = await adminCall('abjad_admin_update_student', {p_id:editing.id, p_patch:{...row, active:$('#fActive').checked}});
      Object.assign(editing, u); toast(t('toast_saved')); $('#dlgStudent').close();
    } else {
      const r = await adminCall('abjad_admin_add_students', {p_rows:[row]});
      if (r.skipped.length) { showMsg($('#dlgStudentMsg'), 'err', `${r.skipped[0].email || 'Email'}: ${r.skipped[0].reason}`); return; }
      students.unshift(...r.added); $('#dlgStudent').close(); openInvite(r.added[0]);
    }
    drawStats(); drawRows();
  } catch (err) {
    showMsg($('#dlgStudentMsg'), 'err', /duplicate key/.test(err.message) ? t('dup_email') : err.message);
  } finally { btn.disabled = false; }
});

/* bulk import */
$('#bulkForm').addEventListener('submit', async e => {
  if (e.submitter?.value !== 'save') return;
  e.preventDefault();
  const rows = $('#bulkText').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const [email, full_name = '', institution = ''] = l.split(/[,;\t]/).map(x => x.trim());
    return {email, full_name, institution};
  });
  if (!rows.length) return showMsg($('#bulkMsg'), 'err', t('bulk_empty'));
  const btn = $('#bulkSave'); btn.disabled = true;
  try {
    const r = await adminCall('abjad_admin_add_students', {p_rows:rows});
    students.unshift(...r.added); drawStats(); drawRows();
    const sk = r.skipped.map(s => `${s.email || '(blank)'}: ${s.reason}`).join('; ');
    showMsg($('#bulkMsg'), r.added.length ? 'ok' : 'err', t('bulk_added', {n:r.added.length}) + (sk ? t('bulk_skipped', {list:sk}) : ''));
    if (r.added.length) $('#bulkText').value = '';
  } catch (err) { showMsg($('#bulkMsg'), 'err', err.message); }
  finally { btn.disabled = false; }
});

/* invitation (English or French) */
function inviteText(s, l){
  const name = (s.full_name || '').trim().split(/\s+/)[0] || '';
  if (l === 'fr') return `Bonjour ${name},

Merci de rejoindre l’équipe de collecte et d’annotation de données Wolofal pour les tâches partagées d’AbjadNLP 2027 (organisées avec COLING 2027).

Connectez-vous au portail des contributeurs pour découvrir la présentation du projet et de vos tâches :

Portail : ${portalUrl()}
E-mail : ${s.email}
Code d’identification : ${s.code}

Ce code est personnel : c’est votre clé d’accès.

Bien cordialement,
L’équipe AbjadNLP 2027 · Wolofal`;
  return `Dear ${name || 'contributor'},

Thank you for joining the Wolofal data collection and annotation team for the AbjadNLP 2027 shared tasks (held with COLING 2027).

Please sign in to the contributor portal to read the presentation of the project and of your tasks:

Portal: ${portalUrl()}
Email: ${s.email}
Identification code: ${s.code}

Keep this code personal; it is your access key.

Best regards,
AbjadNLP 2027 · Wolofal team`;
}
function openInvite(s){
  const fill = l => {
    const txt = inviteText(s, l);
    const subj = l === 'fr' ? 'AbjadNLP 2027 · Wolofal : votre accès au portail des contributeurs' : 'AbjadNLP 2027 · Wolofal: your access to the contributor portal';
    $('#invText').textContent = txt;
    $('#invMail').href = `mailto:${encodeURIComponent(s.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(txt)}`;
    $('#invCopy').onclick = () => copy(txt, t('toast_inv'));
  };
  $('#invName').textContent = s.full_name || s.email;
  $$('input[name=invLang]').forEach(r => { r.checked = r.value === lang; r.onchange = () => fill(r.value); });
  fill(lang);
  $('#dlgInvite').showModal();
}

/* CSV */
const PROFILE_KEYS = ['local_languages','local_level','arabic_script','arabic_script_level','foreign_languages','foreign_level','task_choice'];
function exportCsv(){
  const cols = ['full_name','email','institution','code','T0_status','T1_status','T2_status', ...PROFILE_KEYS, 'active','login_count','last_login_at','created_at','notes'];
  const cell = v => { v = Array.isArray(v) ? v.join(' ') : (v ?? ''); v = String(v); return /[",\n;]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = [cols.join(','), ...students.map(s => { const f = {...(s.profile || {}), ...s, T0_status:statusOf(s,'T0'), T1_status:statusOf(s,'T1'), T2_status:statusOf(s,'T2')}; return cols.map(c => cell(f[c])).join(','); })].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'}));
  a.download = `wolofal-abjadnlp2027-students-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* password */
$('#pwForm').addEventListener('submit', async e => {
  if (e.submitter?.value !== 'save') return;
  e.preventDefault();
  const btn = $('#pwSave'); btn.disabled = true;
  try {
    const r = await adminCall('abjad_admin_change_password', {p_old:$('#pwOld').value, p_new:$('#pwNew').value});
    if (!r.ok) return showMsg($('#pwMsg'), 'err', r.reason);
    $('#dlgPw').close(); toast(t('toast_pw'));
  } catch (err) { showMsg($('#pwMsg'), 'err', err.message); }
  finally { btn.disabled = false; }
});

setLang(lang);
